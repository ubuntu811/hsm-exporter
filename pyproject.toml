[project]
name = "hsm-exporter"
# MAJOR.MINOR only - the build number (currently GitLab's CI_PIPELINE_IID once this
# runs in a pipeline, "dev" for local podman builds) gets appended at image-build time
# to make the full version. See build.sh/run.sh and Containerfile's BUILD_NUMBER arg.
version = "0.3"
description = "Live inventory + Prometheus exporter for Thales Luna HSM appliances"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
  "flask>=3.1,<4",
  "gunicorn>=23,<24",
  "pyyaml>=6.0,<7",
  "requests>=2.32,<3",
]

[dependency-groups]
dev = [
  "pytest>=8,<9",
  "ruff>=0.12,<1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py313"
